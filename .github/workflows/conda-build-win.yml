# This file was generated automatically from conda-smithy. To update this configuration,
# update the conda-forge.yml and/or the recipe/meta.yaml.
# -*- mode: yaml -*-

name: Windows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.CONFIG }}
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - CONFIG: win_64_variantall
            UPLOAD_PACKAGES: 'True'
          - CONFIG: win_64_variantnovtk
            UPLOAD_PACKAGES: 'True'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Miniforge
        shell: python
        run: |
          import urllib.request
          url = 'https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-26.1.0-0-Windows-x86_64.exe'
          path = r"${{ runner.temp }}\Miniforge.exe"
          urllib.request.urlretrieve(url, path)

      - name: Install Miniforge
        shell: cmd
        run: start /wait "" ${{ runner.temp }}\Miniforge.exe /InstallationType=JustMe /RegisterPython=0 /S /D=C:\Miniforge

      - name: Add conda to PATH
        shell: pwsh
        run: echo "C:\Miniforge\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Windows build
        shell: cmd
        run: call ".scripts\run_win_build.bat"
        env:
          PYTHONUNBUFFERED: 1
          CONFIG: ${{ matrix.CONFIG }}
          CI: github_actions
          flow_run_id: github_actions_${{ github.run_id }}.${{ github.run_attempt }}
          remote_url: ${{ github.repositoryUrl }}
          sha: ${{ github.sha }}
          UPLOAD_PACKAGES: ${{ matrix.UPLOAD_PACKAGES }}
          UPLOAD_TEMP: D:\tmp
          CONDA_BLD_PATH: C:\bld\
          BINSTAR_TOKEN: ${{ secrets.BINSTAR_TOKEN }}
          FEEDSTOCK_TOKEN: ${{ secrets.FEEDSTOCK_TOKEN }}
          STAGING_BINSTAR_TOKEN: ${{ secrets.STAGING_BINSTAR_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.CONFIG }}
          path: C:\bld\win-*\*.conda
          if-no-files-found: warn
